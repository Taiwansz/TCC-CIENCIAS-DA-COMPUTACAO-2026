[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toklang"
version = "1.0.0"
description = "TokLang: Compilador e Bancada Experimental de Otimizacao de Prompts e Compressao de Tokens em LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matheus Sousa dos Santos" },
    { name = "Felipe Guarnieri Pinete" },
    { name = "Guilherme Gustavo Weber" },
    { name = "Juan Pedro" }
]
keywords = ["prompt-compression", "token-optimization", "green-ai", "llm", "compilers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-docx>=1.1.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "tiktoken>=0.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]
